name: Deploy BAZOO to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: bazoo-production-pages-v3
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check admin.js
          node --check client.js
          node --check bundle.js
          node smoke-test.cjs
          node admin-role-test.cjs
          node discount-test.cjs
          node media-upload-test.cjs
          node localization-scroll-test.cjs
          node product-save-test.cjs
          node admin-controls-test.cjs
          node admin-auth-test.cjs
          node auth-refresh-concurrency-test.cjs
          node admin-persistence-test.cjs
          node order-workflow-test.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Allow Pages artifact to become available
        run: sleep 12
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
